name: Shell checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq unzip file xz-utils
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Install latest stable Fish
        shell: bash
        run: |
          # A receive error can interrupt GitHub downloads before tests start.
          # Each attempt still performs release and checksum validation.
          for attempt in 1 2 3; do
            if bash scripts/install-fish.sh; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Syntax and regression tests
        shell: bash
        run: bash scripts/check.sh
